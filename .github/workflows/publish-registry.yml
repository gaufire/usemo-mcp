name: Publish hosted MCP metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usemo-mcp-registry-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch and check this commit's public metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/gaufire/usemo-mcp/${GITHUB_SHA}/server.json" \
            -o server.json
          python3 - <<'PY'
          import json
          s = json.load(open("server.json", encoding="utf-8"))
          assert s["name"] == "io.github.gaufire/usemo-mcp"
          assert len(s["description"]) <= 100
          assert s["remotes"] == [{"type": "streamable-http", "url": "https://api.usemo.com/mcp"}]
          assert "packages" not in s
          print("Verified UseMo hosted-server metadata:", s["version"])
          PY
      - name: Verify and run the official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            -o mcp-publisher.tar.gz
          printf '%s  %s\n' 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' 'mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
